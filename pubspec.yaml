name: bakometr
description: "Nocny Licznik — nocny monitor snu z liczeniem wiatrów, chrapania, światła i inteligentnym budzikiem."
publish_to: 'none'
version: 2.5.0+7

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: any
  tflite_flutter: any
  sensors_plus: any
  sqflite: any
  path_provider: any
  path: any
  shared_preferences: any
  just_audio: any
  share_plus: ^13.0.0
  file_picker: ^13.1.0
  bakometr_native:
    path: packages/bakometr_native

dev_dependencies:
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/yamnet.tflite
    - assets/yamnet_class_map.csv

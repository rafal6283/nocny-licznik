name: bakometr
description: "Rytm Snu — rejestracja i analiza snu: fazy, chrapanie, bezdech, CPAP, sonar, pogoda; opcjonalnie liczenie wiatrów."
publish_to: 'none'
version: 2.8.1+11

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: any
  tflite_flutter: any
  sensors_plus: any
  sqflite: any
  path_provider: any
  path: any
  shared_preferences: any
  just_audio: any
  share_plus: ^13.0.0
  file_picker: ^13.1.0
  flutter_secure_storage: any
  connectivity_plus: any
  bakometr_native:
    path: packages/bakometr_native
  koofr_sync:
    path: packages/koofr_sync

dev_dependencies:
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/yamnet.tflite
    - assets/yamnet_class_map.csv

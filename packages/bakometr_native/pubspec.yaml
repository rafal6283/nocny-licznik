name: bakometr_native
description: Natywne funkcje Nocnego Licznika (usługa w tle, czujnik światła, wibracje, powiadomienia, budzik).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: pl.rafal.bakometr_native
        pluginClass: BakometrNativePlugin
      ios:
        pluginClass: BakometrNativePlugin
